# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
# Compile in-process instead of a separate Kotlin daemon (works in sandboxed/CI environments).
kotlin.compiler.execution.strategy=in-process

# ---------------------------------------------------------------------------
# Local proxy (Clash mixed HTTP/SOCKS5 on 127.0.0.1:7890).
# Needed to reach Maven Central / Google Maven from this machine.
# Delete these four lines if you have direct internet access.
# ---------------------------------------------------------------------------
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
